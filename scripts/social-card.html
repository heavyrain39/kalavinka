<!doctype html>
<html lang="en" data-theme-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Kalavinka social card</title>
    <style>
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body { background-size: 60px 60px; background-position: -1px -1px; }
      .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px 0; overflow: hidden;
        background: radial-gradient(ellipse 70% 90% at 82% 30%, rgba(16,17,19,0) 0%, rgba(16,17,19,.55) 55%, rgba(16,17,19,.9) 100%); }
      .sky { position: absolute; top: -40px; right: -10px; width: 520px; height: 520px; }
      .mark { position: relative; display: inline-flex; align-items: flex-start; font-family: var(--font-logo); font-weight: 850;
        letter-spacing: -.055em; line-height: .9; color: var(--text); }
      .mark .name { font-size: 112px; }
      .mark .cross { font-size: 44px; margin: -6px 0 0 6px; color: var(--text-dim); }
      .ko { margin-top: 18px; font-family: 'Pretendard Variable', 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 26px;
        letter-spacing: .32em; color: var(--text-dim); }
      .line { margin-top: 34px; font-size: 34px; line-height: 1.3; font-weight: 500; letter-spacing: -.015em; color: var(--text); }
      .line span { color: var(--text-dim); }
      :lang(ko) .line, :lang(ko) .meta #moods { font-family: 'Pretendard Variable', 'Noto Sans KR', 'Malgun Gothic', sans-serif; letter-spacing: -.02em; }
      .card-deck { position: absolute; left: 72px; right: 72px; bottom: 56px; border: 1px solid var(--line-strong); background: rgba(16,17,19,.82); }
      .roll { display: block; width: 100%; height: 112px; }
      .lane { display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); border-top: 1px solid var(--line); }
      .lane div { padding: 9px 4px; text-align: center; font-family: var(--font-mono); font-size: 15px; color: var(--text-dim); white-space: nowrap; }
      .lane div + div { border-left: 1px solid var(--line); }
      .meta { position: absolute; left: 72px; right: 72px; bottom: 18px; display: flex; justify-content: space-between;
        font-family: var(--font-mono); font-size: 15px; color: var(--text-dim); letter-spacing: .02em; }
    </style>
  </head>
  <body>
    <div class="card">
      <canvas class="sky" id="sky"></canvas>
      <div class="mark"><span class="name">Kalavinka</span><span class="cross">+</span></div>
      <div class="ko" lang="ko">가릉빈가</div>
      <p class="line" id="line">Endless music for work and study,<br /><span>composed live in your browser.</span></p>
      <div class="card-deck"><canvas class="roll" id="roll"></canvas><div class="lane" id="lane"></div></div>
      <div class="meta"><span id="moods">LO-FI · AMBIENT · ELECTRONIC</span><span id="address">heavyrain39.github.io/kalavinka</span></div>
    </div>
    <script type="module" src="./social-card.ts"></script>
  </body>
</html>
